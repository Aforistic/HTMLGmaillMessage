<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Practical</title>
</head>
<body>
    <h1>Send me a message to apply for our amazing training program</h1>

    <form action="https://formsubmit.co/aftechinfo27@gmail.com" method="POST">
        <input type="text" name="name" placeholder="Your Name" required><br><br>
        <input type="email" name="email" placeholder="Your Email" required><br><br>
        <textarea name="message" placeholder="Your Message" required></textarea><br><br>

        <!-- Optional Settings -->
        <input type="hidden" name="_subject" value="New Message from Your Website!">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://formsubmit.co/thank-you">

        <button type="submit">Send Message</button>
    </form>
</body>
</html>
